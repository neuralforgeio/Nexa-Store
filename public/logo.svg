<?xml version="1.0" encoding="utf-8"?>
<!-- Nexa Store — logo resmi: "N" emas bergradasi + sparkle (v1.22.3).
     Menggantikan ikon scaffold bawaan (huruf Z) yang tersisa dari template.
     Konsisten dengan logo.png 256x256: squircle gelap, N ribbon 3-faset,
     sparkle empat titik di bahu kanan atas. -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30" role="img">
  <title>Nexa Store</title>
  <defs>
    <linearGradient id="nbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24252b"/>
      <stop offset="1" stop-color="#15161a"/>
    </linearGradient>
    <linearGradient id="nbd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fcd34d" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#f59e0b" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ea580c" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="ngL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fde047"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ngD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="ngR" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
  </defs>

  <!-- Latar squircle gelap + bingkai emas tipis -->
  <rect x="0.75" y="0.75" width="28.5" height="28.5" rx="4.75"
        fill="url(#nbg)" stroke="url(#nbd)" stroke-width="1.3"/>

  <!-- Siluet N penuh (dasar, anti-seam) -->
  <path d="M6.5,24 L6.5,6 L10.2,6 L19.8,16.6 L19.8,6 L23.5,6 L23.5,24 L19.8,24 L10.2,13.4 L10.2,24 Z"
        fill="url(#ngD)"/>

  <!-- Faset kiri: batang terang -->
  <path d="M6.5,6 L10.2,6 L10.2,24 L6.5,24 Z" fill="url(#ngL)"/>

  <!-- Faset kanan: batang gelap (lipatan ribbon) -->
  <path d="M19.8,6 L23.5,6 L23.5,24 L19.8,24 Z" fill="url(#ngR)"/>

  <!-- Sparkle empat titik di bahu kanan atas -->
  <path d="M24.7,2.9 C25.1,4.35 25.45,4.7 26.9,5.1 C25.45,5.5 25.1,5.85 24.7,7.3 C24.3,5.85 23.95,5.5 22.5,5.1 C23.95,4.7 24.3,4.35 24.7,2.9 Z"
        fill="#fde68a"/>
</svg>
